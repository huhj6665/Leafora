# Alembic configuration.
# The database URL is injected at runtime by alembic/env.py from the app
# settings (environment variables), so sqlalchemy.url is left empty here.

[alembic]
# Path to the migration scripts directory
script_location = alembic
# Prepend the current directory (backend/) to sys.path so the `app` package is importable
prepend_sys_path = .
# Revision file naming template
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url =

[post_write_hooks]
# Hooks executed after a migration script is generated (empty by default)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
